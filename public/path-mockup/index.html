<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>推演路径 · v4 Cube</title>
<style>
  :root{
    --bg-1:#2a1f1a;
    --bg-2:#1c1410;
    --cream:#F5EEDD;
    --cream-2:#EDE3CC;
    --milk:#F8F2E4;
    --warm-clay:#C8896E;
    --warm-lavender:#A88BC0;
    --gold:#B89046;
    --gold-soft:#D4AC5C;
    --text-dark:#3D2E22;
    --text-mid:#5E4A38;
    --text-dim:#8E7858;
    --text-cream:#E0D2B4;
    --text-cream-dim:#B8A88A;
    --shadow:0 16px 38px -16px rgba(0,0,0,.55), 0 6px 16px -10px rgba(0,0,0,.35);
    --shadow-hover:0 24px 56px -16px rgba(0,0,0,.6), 0 10px 24px -14px rgba(0,0,0,.45);
    --shadow-pop:0 40px 80px -20px rgba(184,144,70,.5), 0 20px 40px -18px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    height:100%;
    background:#14110D;
    color:#F5EFE3;
    font-family:"PingFang SC","Noto Sans SC",sans-serif;
    overflow:hidden;
  }

  body::before,body::after{
    content:"";position:fixed;inset:-20%;pointer-events:none;
    background:
      radial-gradient(ellipse 50% 35% at 25% 35%,rgba(232,184,106,.05),transparent 60%),
      radial-gradient(ellipse 45% 30% at 75% 65%,rgba(200,137,110,.04),transparent 60%);
    filter:blur(50px);
    z-index:0;
  }
  body::after{animation:drift 80s ease-in-out infinite;opacity:.6}
  @keyframes drift{
    0%,100%{transform:translate(0,0) scale(1)}
    33%{transform:translate(2%,-2%) scale(1.04)}
    66%{transform:translate(-1%,2%) scale(1.02)}
  }

  /* topbar */
  header{
    position:fixed;top:0;left:0;right:0;z-index:100;
    height:56px;padding:0 20px;
    display:flex;align-items:center;gap:14px;
    background:rgba(28,20,16,.6);
    backdrop-filter:blur(24px) saturate(120%);
    border-bottom:1px solid rgba(232,199,176,.08);
  }
  .logo{font-size:13px;letter-spacing:.16em;font-weight:500;color:var(--gold-soft);text-transform:uppercase;font-family:"Iowan Old Style",serif}
  .logo small{margin-left:10px;color:var(--text-cream-dim);font-size:10px;letter-spacing:.08em;text-transform:none;font-style:italic}
  .back-btn{
    display:none;align-items:center;gap:6px;
    padding:6px 12px 6px 9px;
    background:rgba(245,238,221,.08);
    border:1px solid rgba(245,238,221,.18);
    border-radius:99px;
    color:var(--cream);font-size:11.5px;
    cursor:pointer;transition:all .2s;font-family:inherit;
  }
  .back-btn:hover{background:rgba(245,238,221,.14);transform:translateX(-2px)}
  .back-btn.show{display:inline-flex}

  .breadcrumb{display:flex;align-items:center;gap:6px;font-size:11px;font-family:ui-monospace,monospace;color:var(--text-cream-dim);flex:1;overflow:hidden}
  .crumb{padding:4px 10px;background:rgba(245,238,221,.04);border:1px solid rgba(245,238,221,.12);border-radius:99px;color:#D6C7A8;cursor:pointer;transition:all .2s;white-space:nowrap}
  .crumb:hover{background:rgba(245,238,221,.12);color:var(--cream)}
  .crumb.now{background:rgba(212,172,92,.18);border-color:rgba(212,172,92,.45);color:var(--gold-soft);cursor:default}
  .arr{color:var(--text-dim);font-size:9px;opacity:.6}
  .depth{margin-left:auto;font-size:10px;letter-spacing:.12em;color:var(--text-cream-dim);font-family:ui-monospace,monospace;padding:5px 12px;background:rgba(245,238,221,.04);border:1px solid rgba(245,238,221,.1);border-radius:99px}
  .depth strong{color:var(--gold-soft);font-weight:600}

  /* canvas - 允许垂直滚动 */
  main{
    position:absolute;top:104px;left:0;right:0;bottom:0;
    overflow-x:hidden;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    z-index:1;
  }
  main::-webkit-scrollbar{width:0}
  .stage{position:relative;width:100%;min-height:100%;height:auto}

  svg.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  @media (max-width:720px){
    svg.edges,svg.trail,.down-arrow{display:none}
  }
  .edge{
    fill:none;
    stroke:rgba(245,238,221,.15);
    stroke-width:1;
    stroke-dasharray:2 5;
    transition:all .6s;
  }
  .edge.active{stroke:rgba(212,172,92,.6);stroke-width:1.5;stroke-dasharray:none}
  .edge.swan{stroke:rgba(168,139,192,.3);stroke-dasharray:1 6}

  /* path trail - flowing */
  svg.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .trail line{
    stroke:rgba(212,172,92,.55);stroke-width:2;
    stroke-dasharray:6 4;
    animation:trailFlow 1.8s linear infinite;
    filter:drop-shadow(0 0 4px rgba(212,172,92,.4));
  }
  @keyframes trailFlow{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-20}}

  /* down arrow */
  .down-arrow{
    position:absolute;width:34px;height:34px;
    pointer-events:none;z-index:2;
  }
  .down-arrow path{fill:none;stroke:rgba(212,172,92,.6);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;animation:arrowBlink 2.2s ease-in-out infinite}
  @keyframes arrowBlink{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:.95;transform:translateY(5px)}}

  /* nodes - flat with simple animation */
  .nodes{position:absolute;inset:0;pointer-events:none}
  .node{
    position:absolute;
    pointer-events:auto;
    cursor:pointer;
    transform:translate(-50%,-50%);
    transition:all .55s cubic-bezier(.34,1.4,.5,1);
    -webkit-tap-highlight-color:transparent;
  }
  .node.entering{
    opacity:0;
    transform:translate(-50%,-50%) scale(.6);
  }
  .node.dim{
    opacity:.4;
    transform:translate(-50%,-50%) scale(.72);
    filter:saturate(.7);
  }
  .node.dim:hover,.node.dim:active{opacity:.85}
  .node.current .bubble{
    box-shadow:var(--shadow-pop);
    transform:scale(1.06);
  }

  /* tile - zerozero 配色 */
  .bubble{
    position:relative;
    background:#1A1612;
    border:1px solid rgba(255,255,255,.06);
    border-left:3px solid #D4B670;
    border-radius:12px;
    box-shadow:0 4px 16px -6px rgba(0,0,0,.4);
    padding:12px 14px;
    width:170px;
    min-height:108px;
    display:flex;flex-direction:column;justify-content:space-between;
    transition:all .25s cubic-bezier(.34,1.3,.5,1);
    color:#F5EFE3;
  }
  /* 主题 (origin) 最大 + 强调 */
  .node.l0 .bubble{
    width:230px;
    min-height:142px;
    padding:18px 22px;
    border-radius:16px;
    border-left-width:4px;
    background:linear-gradient(180deg,#231C13,#1A1612);
  }
  .node.l2 .bubble{
    width:158px;
    min-height:98px;
    padding:10px 13px;
    border-radius:11px;
  }
  .node.l3 .bubble{
    width:144px;
    min-height:88px;
    padding:9px 12px;
    border-radius:10px;
  }

  /* 类型颜色 = 左边竖条颜色 */
  .node.type-main .bubble{border-left-color:#D4B670}
  .node.type-contra .bubble{border-left-color:#A89B82}
  .node.type-swan .bubble{border-left-color:#B886C8}
  .node.type-shrink .bubble{border-left-color:#C8857D}
  .node.type-origin .bubble{
    border-left-color:#D4B670;
    box-shadow:0 6px 24px -8px rgba(212,182,112,.25), 0 4px 12px -6px rgba(0,0,0,.5);
  }

  .bubble-tag{
    font-size:9px;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;
    color:#A89B82;
    font-family:ui-monospace,monospace;
  }
  .node.type-swan .bubble-tag{color:#B886C8}
  .node.type-contra .bubble-tag{color:#A89B82}
  .node.type-shrink .bubble-tag{color:#C8857D}
  .node.type-origin .bubble-tag{color:#D4B670}

  .bubble-title{
    font-size:14px;font-weight:600;
    line-height:1.3;
    color:#F5EFE3;
    margin:6px 0;
    flex:1;
    display:flex;align-items:center;
  }
  .node.l0 .bubble-title{font-size:16px;font-weight:700;color:#F5EFE3}
  .node.l2 .bubble-title{font-size:13px}
  .node.l3 .bubble-title{font-size:12.5px}

  .bubble-meta{
    display:flex;align-items:center;gap:6px;
    font-size:10px;
    font-family:ui-monospace,monospace;
    color:#A89B82;
  }
  .meter-bar{
    flex:1;height:3px;
    background:rgba(255,255,255,.06);
    border-radius:99px;overflow:hidden;
  }
  .meter-fill{height:100%;background:#D4B670;border-radius:99px}
  .node.type-swan .meter-fill{background:#B886C8}
  .node.type-shrink .meter-fill{background:#C8857D}
  .bubble-impact{
    font-weight:700;
    padding:1px 6px;
    background:rgba(212,182,112,.12);
    color:#D4B670;
    border-radius:4px;
    font-size:10px;
  }

  .node:hover{z-index:10}
  .node:hover .bubble{transform:scale(1.05);box-shadow:var(--shadow-hover)}
  .node.visited:not(.current):not(.dim) .bubble{border:1px solid rgba(212,172,92,.35)}

  /* === DETAIL PANEL: 右侧滑出 + 上下翻页 === */
  aside{
    position:fixed;top:56px;right:-460px;width:460px;bottom:0;
    background:linear-gradient(180deg,#FBF6E8,#F2EAD3);
    color:var(--text-dark);
    box-shadow:-30px 0 80px -20px rgba(0,0,0,.55), -10px 0 30px -10px rgba(0,0,0,.4);
    overflow:hidden;
    transition:right .5s cubic-bezier(.34,1.4,.5,1);
    z-index:50;
    display:flex;
    flex-direction:column;
  }
  aside.open{right:0}
  aside .close{
    position:absolute;top:14px;right:14px;
    background:rgba(61,46,34,.08);border:none;color:var(--text-mid);
    font-size:18px;cursor:pointer;
    width:32px;height:32px;
    border-radius:50%;display:grid;place-items:center;
    transition:all .2s;z-index:5;
  }
  aside .close:hover{background:rgba(61,46,34,.16);color:var(--text-dark)}

  /* 翻页条 */
  .pager{
    flex-shrink:0;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;
    background:rgba(212,172,92,.12);
    font-size:11px;font-family:ui-monospace,monospace;
    color:var(--text-mid);letter-spacing:.06em;
  }
  .pager-top{
    padding:14px 60px 14px 18px;
    border-bottom:1px solid rgba(61,46,34,.08);
  }
  .pager-bottom{
    display:none;
    border-top:1px solid rgba(61,46,34,.08);
  }
  .pager-back{
    background:rgba(184,144,70,.18);
    border-color:rgba(184,144,70,.5);
    color:var(--text-dark);
    font-weight:700;
  }
  .pager-back:hover{
    background:var(--gold-soft);
  }
  .pager-btn{
    display:inline-flex;align-items:center;gap:5px;
    padding:6px 12px;
    background:rgba(245,238,221,.6);
    border:1px solid rgba(184,144,70,.3);
    border-radius:99px;
    color:var(--text-dark);
    font-size:11px;font-weight:600;
    cursor:pointer;
    transition:all .2s;
    font-family:inherit;
  }
  .pager-btn:hover:not(:disabled){
    background:var(--gold-soft);
    transform:translateY(-1px);
    box-shadow:0 4px 12px -4px rgba(184,144,70,.5);
  }
  .pager-btn:disabled{
    opacity:.35;cursor:not-allowed;
  }
  .pager-info{
    font-size:10px;color:var(--text-dim);
    letter-spacing:.12em;text-transform:uppercase;
    text-align:center;
  }
  .pager-info strong{color:var(--gold);font-weight:700}

  aside .header-row{
    padding:24px 28px 16px;
    border-bottom:1px solid rgba(61,46,34,.08);
    flex-shrink:0;
  }
  aside .kicker{font-size:10px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;font-weight:700;margin-bottom:8px;font-family:ui-monospace,monospace}
  aside .title{font-size:22px;font-weight:600;color:var(--text-dark);margin-bottom:6px}
  aside .title-en{font-size:11px;letter-spacing:.08em;color:var(--text-dim);font-family:"Iowan Old Style",serif;font-style:italic;margin-bottom:14px}
  .meters-inline{display:flex;gap:18px;flex-wrap:wrap}
  .meters-inline .meter{display:flex;align-items:center;gap:8px;font-size:11px}
  .meters-inline .meter-label{width:auto;color:var(--text-dim);font-family:ui-monospace,monospace;font-size:10px}
  .meters-inline .meter-track{width:90px;height:5px;background:rgba(61,46,34,.06);border-radius:99px;overflow:hidden}
  .meters-inline .meter-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--warm-clay));border-radius:99px}
  .meters-inline .meter-val{font-family:ui-monospace,monospace;font-size:11px;color:var(--text-dark);font-weight:700;min-width:42px;text-align:right}

  aside .body{
    padding:20px 28px 32px;
    overflow-y:auto;
    flex:1;
    scrollbar-width:thin;
  }
  aside .body::-webkit-scrollbar{width:6px}
  aside .body::-webkit-scrollbar-thumb{background:rgba(184,144,70,.3);border-radius:99px}

  /* === 扩展字段样式 === */
  .time-window{
    display:inline-block;
    padding:4px 11px;margin-bottom:14px;
    background:rgba(184,144,70,.14);
    border:1px solid rgba(184,144,70,.3);
    border-radius:99px;
    font-size:10.5px;font-family:ui-monospace,monospace;
    color:var(--text-mid);letter-spacing:.06em;
  }
  .list-trigger li::before{content:"⚡";color:#C8896E}
  .list-key li{
    padding:6px 8px 6px 22px;
    background:rgba(184,144,70,.08);
    border-left:2px solid var(--gold);
    margin-bottom:4px;border-radius:0 6px 6px 0;
    font-weight:500;
  }
  .list-key li::before{content:"🔭";left:6px;top:6px}
  .list-warn li{
    padding:6px 8px 6px 22px;
    background:rgba(168,80,80,.08);
    border-left:2px solid #A85050;
    margin-bottom:4px;border-radius:0 6px 6px 0;
    color:#7A3A2F;
  }
  .list-warn li::before{content:"⚠";color:#A85050;left:6px;top:5px}

  .list-counter li{
    padding:6px 8px 6px 22px;
    background:rgba(95,140,180,.08);
    border-left:2px solid #5F8CB4;
    margin-bottom:4px;border-radius:0 6px 6px 0;
    color:#2F4F7A;
  }
  .list-counter li::before{content:"🤔";left:5px;top:4px;font-size:10px}

  .list-play li{
    padding:6px 8px 6px 22px;
    background:rgba(138,181,138,.08);
    border-left:2px solid #6B9B6B;
    margin-bottom:4px;border-radius:0 6px 6px 0;
    color:#2F4F2F;
  }
  .list-play li::before{content:"🎯";left:5px;top:4px;font-size:10px}

  .analog-block{
    background:rgba(184,144,70,.06);
    border:1px dashed rgba(184,144,70,.3);
    padding:11px 13px;
    border-radius:8px;
    font-size:12px;line-height:1.6;
  }
  .analog-era{
    font-family:ui-monospace,monospace;
    font-size:11px;font-weight:700;
    color:var(--gold);letter-spacing:.06em;
    margin-bottom:4px;
  }
  .analog-what{color:var(--text-dark);margin-bottom:4px}
  .analog-lesson{
    color:var(--text-mid);font-style:italic;
    padding-top:4px;border-top:1px dashed rgba(184,144,70,.2);
  }

  .people-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
  .person{
    font-size:11px;
    padding:4px 9px;
    background:rgba(184,144,70,.1);
    border:1px solid rgba(184,144,70,.25);
    border-radius:99px;
    color:var(--text-dark);
    font-weight:500;
  }

  .scenarios{display:flex;flex-direction:column;gap:6px;margin-top:4px}
  .sc{display:flex;align-items:center;gap:8px;font-size:11px;font-family:ui-monospace,monospace}
  .sc-label{width:36px;color:var(--text-mid);font-size:10px}
  .sc-bar{flex:1;height:6px;background:rgba(61,46,34,.06);border-radius:99px;overflow:hidden}
  .sc-fill{height:100%;border-radius:99px;display:block}
  .sc-bull .sc-fill{background:linear-gradient(90deg,#8AB58A,#5C9E5C)}
  .sc-bull .sc-label{color:#3F6B3F}
  .sc-base .sc-fill{background:linear-gradient(90deg,#D4AC5C,#B89046)}
  .sc-base .sc-label{color:var(--gold)}
  .sc-bear .sc-fill{background:linear-gradient(90deg,#D8AE92,#A85050)}
  .sc-bear .sc-label{color:#A85050}
  .sc-val{font-weight:700;color:var(--text-dark);min-width:36px;text-align:right}

  /* === 主题切换 === */
  .theme-bar{
    position:fixed;
    top:62px;left:50%;transform:translateX(-50%);
    z-index:20;
    display:flex;gap:4px;
    padding:5px;
    background:rgba(28,20,16,.75);
    border:1px solid rgba(232,199,176,.12);
    border-radius:99px;
    backdrop-filter:blur(14px);
    max-width:calc(100vw - 32px);
    overflow-x:auto;
    overflow-y:hidden;
    scrollbar-width:none;
    -ms-overflow-style:none;
    -webkit-overflow-scrolling:touch;
    white-space:nowrap;
  }
  .theme-bar::-webkit-scrollbar{display:none}
  .theme-btn{
    flex:0 0 auto;
    padding:5px 11px;
    background:transparent;border:none;
    color:var(--text-cream-dim);
    font-size:11px;letter-spacing:.04em;
    cursor:pointer;border-radius:99px;
    font-family:inherit;
    transition:all .2s;
    display:inline-flex;align-items:center;gap:4px;
  }
  .theme-btn:hover{color:var(--cream)}
  .theme-btn.active{
    background:rgba(212,172,92,.25);
    color:var(--gold-soft);
    box-shadow:inset 0 0 0 1px rgba(212,172,92,.4);
  }
  .theme-btn .emoji{font-size:13px}
  @media (max-width:720px){
    .theme-bar{
      top:54px;
      padding:4px;gap:2px;
      left:8px;right:8px;
      transform:none;
      max-width:calc(100vw - 16px);
    }
    .theme-btn{padding:5px 9px;font-size:10.5px;gap:3px}
    .theme-btn .emoji{font-size:12px}
  }
  aside h3{font-size:10px;letter-spacing:.18em;font-weight:700;color:var(--gold);text-transform:uppercase;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid rgba(61,46,34,.08)}
  .thesis{font-size:13.5px;line-height:1.8;color:var(--text-dark);background:rgba(212,172,92,.1);border-left:3px solid var(--gold);padding:12px 16px;border-radius:0 8px 8px 0}
  ul.list{list-style:none;font-size:12.5px;line-height:1.75}
  ul.list li{padding-left:18px;position:relative;color:var(--text-dark);margin-bottom:6px}
  ul.list li::before{content:"▸";position:absolute;left:0;color:var(--gold);font-size:11px;top:2px}
  .ev{font-size:11.5px;line-height:1.65;padding:10px 14px;margin-bottom:6px;background:rgba(61,46,34,.03);border:1px solid rgba(61,46,34,.06);border-radius:8px;color:var(--text-dark)}
  .ev .ev-date{font-family:ui-monospace,monospace;font-size:9.5px;color:var(--gold);letter-spacing:.06em;font-weight:700;margin-bottom:3px}
  .stocks{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
  .stock{font-family:ui-monospace,monospace;font-size:10.5px;font-weight:700;padding:4px 9px;background:rgba(168,184,152,.22);border:1px solid rgba(168,184,152,.45);border-radius:5px;color:#3F5A3F;letter-spacing:.04em}
  .stock.loss{background:rgba(200,137,110,.22);border-color:rgba(200,137,110,.45);color:#8E4A2F}
  .next-btn{display:block;width:100%;margin-top:18px;padding:14px;background:linear-gradient(180deg,#F0DCA8,#D4AC5C);border:none;color:#3D2E22;font-size:13.5px;font-weight:700;letter-spacing:.06em;border-radius:14px;cursor:pointer;box-shadow:0 8px 20px -8px rgba(212,172,92,.6);transition:all .2s}
  .next-btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px -8px rgba(212,172,92,.8)}
  .end-note{margin-top:18px;padding:16px;text-align:center;font-size:11.5px;color:var(--text-dim);letter-spacing:.08em;border:1px dashed rgba(184,144,70,.3);border-radius:10px}

  /* ━━━ 手机优化 ━━━ */
  @media (max-width:720px){
    header{height:50px;padding:0 12px;gap:8px}
    .logo{font-size:11px}
    .logo small{display:none}
    .back-btn{padding:5px 10px 5px 7px;font-size:10.5px}
    .breadcrumb{font-size:10px;gap:4px;flex:1}
    .crumb{padding:3px 8px;font-size:10px;max-width:110px;overflow:hidden;text-overflow:ellipsis}
    .depth{font-size:9px;padding:4px 9px}

    main{top:50px}

const THEMES = [
  { id:"origin", label:"AI 算力", emoji:"🧮" },
  { id:"humanoid-origin", label:"人形机器人", emoji:"🤖" },
  { id:"stablecoin-origin", label:"稳定币", emoji:"💵" },

  { id:"climate-origin", label:"气候变化", emoji:"🌍" },
  { id:"ev-origin", label:"EV 后周期", emoji:"⚡" },
  { id:"bci-origin", label:"脑机接口", emoji:"🧠" }
];
let currentTheme = "origin";

const VB_W = 1600, VB_H = 900;
const CX = VB_W/2;
const visited = new Set(["origin"]);
let pathStack = [];
let layout = {};

function isMobile(){ return window.innerWidth < 720; }

function getOriginId(){ return currentTheme; }

function layoutRender(){
  layout = {};
  const mobile = isMobile();
  const ORIGIN = getOriginId();
  // 手机用屏幕实坐标, 桌面用 VB 坐标
  const CENTER = mobile ? screenCX() : CX;

  // 像素值, 手机直接用, 桌面缩放后用
  const L1_W = mobile ? 165 : 186;
  const L1_H = mobile ? 130 : 142;
  const L2_W = mobile ? 152 : 170;
  const L2_H = mobile ? 116 : 130;
  const ORIGIN_H = mobile ? 128 : 150;

  if (pathStack.length === 0){
    layout[ORIGIN] = { x: CENTER, y: mobile ? 220 : 220, level: 0 };
    const l1 = NODES[ORIGIN].children;
    const cols = mobile ? 2 : Math.min(5, l1.length);
    const rowYStart = layout[ORIGIN].y + ORIGIN_H/2 + (mobile ? 80 : 90);
    l1.forEach((id, i) => {
      const c = i % cols;
      const r = Math.floor(i / cols);
      layout[id] = {
        x: CENTER - (cols-1)*L1_W/2 + c*L1_W,
        y: rowYStart + r*L1_H,
        level: 1
      };
    });
    return;
  }

  const chain = [ORIGIN, ...pathStack];
  const selected = chain[chain.length - 1];

  let curY = mobile ? 150 : 160;
  chain.forEach((id, i) => {
    layout[id] = { x: CENTER, y: curY, level: i, current: i === chain.length - 1 };
    curY += (i === 0 ? (mobile ? 130 : 140) : (mobile ? 128 : 130));
  });

  const selNode = NODES[selected];
  if (selNode && selNode.children.length){
    const kids = selNode.children;
    const childY = curY + 10;
    const cols = mobile ? Math.min(2, kids.length) : Math.min(5, kids.length);
    kids.forEach((id, i) => {
      const c = i % cols;
      const r = Math.floor(i / cols);
      layout[id] = {
        x: CENTER - (cols-1)*L2_W/2 + c*L2_W,
        y: childY + r*L2_H,
        level: chain.length
      };
    });
  }

  // sibling: 桌面在右侧, 手机在 chain 旁边收缩展示
  const parentInChain = chain[chain.length - 2];
  const parentNode = NODES[parentInChain];
  if (parentNode){
    const siblings = parentNode.children.filter(id => id !== selected);
    if (mobile){
      // 手机: 隐藏 sibling (避免拥挤)
      siblings.forEach(id => { /* skip */ });
    } else {
      siblings.forEach((id, i) => {
        layout[id] = { x: VB_W - 180, y: 200 + i * 130, level: chain.length - 1, dim: true };
      });
    }
  }
}

function pxFromVB(x, y){
  // 手机: 直接用屏幕坐标 (不缩放)
  if (isMobile()) return { left: x, top: y, scale: 1 };
  // 桌面: SVG viewBox 缩放
  const main = document.querySelector("main");
  const w = main.clientWidth, h = main.clientHeight;
  const scale = Math.min(w/VB_W, h/VB_H);
  const xs = (w - VB_W*scale)/2;
  const ys = (h - VB_H*scale)/2;
  return { left: xs + x*scale, top: ys + y*scale, scale };
}

function screenCX(){ return window.innerWidth / 2; }

let prevChildrenIds = new Set();

function render(animate = false){
  layoutRender();
  const edges = document.getElementById("edges");
  const trail = document.getElementById("trail");
  const arrows = document.getElementById("arrows");
  const nodes = document.getElementById("nodes");
  const stage = document.getElementById("stage");

  // === Cube flip animation ===
  if (animate){
    stage.classList.add("flip");
    setTimeout(() => stage.classList.remove("flip"), 320);
  }

  edges.innerHTML = "";
  trail.innerHTML = "";
  arrows.innerHTML = "";
  nodes.innerHTML = "";

  // stage 撑高让外层滚动
  let maxY = 0;
  Object.values(layout).forEach(p => { if (p && p.y > maxY) maxY = p.y; });
  const stageEl = document.getElementById("stage");
  if (stageEl) stageEl.style.minHeight = (maxY + 240) + "px";

  Object.keys(NODES).forEach(id => {
    const node = NODES[id];
    if (!layout[id]) return;
    node.children.forEach(cid => {
      if (!layout[cid]) return;
      const x1 = layout[id].x, y1 = layout[id].y;
      const x2 = layout[cid].x, y2 = layout[cid].y;
      const isOnPath = pathStack.includes(cid) || (id === pathStack[pathStack.length-1]);
      const swan = NODES[cid].type === "swan";
      const cls = "edge" + (swan ? " swan" : "") + (isOnPath ? " active" : "");
      const midX = (x1+x2)/2;
      const midY = (y1+y2)/2 + (Math.abs(x2-x1) > 100 ? 20 : 0);
      edges.insertAdjacentHTML("beforeend", `<path class="${cls}" d="M${x1},${y1} Q${midX},${midY} ${x2},${y2}"/>`);
    });
  });

  if (pathStack.length >= 1){
    const chain = [getOriginId(), ...pathStack];
    for (let i = 0; i < chain.length - 1; i++){
      const a = layout[chain[i]], b = layout[chain[i+1]];
      if (!a || !b) continue;
      trail.insertAdjacentHTML("beforeend", `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`);
    }
  }

  const selected = pathStack[pathStack.length-1] || getOriginId();
  const selNode = NODES[selected];
  if (selNode && selNode.children.length && layout[selected]){
    const sx = layout[selected].x, sy = layout[selected].y;
    const { left, top, scale } = pxFromVB(sx, sy + 80);
    arrows.insertAdjacentHTML("beforeend", `
      <svg class="down-arrow" style="left:${left}px;top:${top}px;transform:translate(-50%,0) scale(${scale})">
        <path d="M17 4 L17 24 M9 17 L17 25 L25 17"/>
      </svg>
    `);
  }

  // Identify "new" children (entering animation)
  const currentChildrenIds = new Set();
  if (selNode && selNode.children.length){
    selNode.children.forEach(id => currentChildrenIds.add(id));
  }
  const newlyEntering = animate
    ? [...currentChildrenIds].filter(id => !prevChildrenIds.has(id))
    : [];

  Object.keys(layout).forEach(id => {
    const node = NODES[id];
    if (!node) return;
    const pos = layout[id];
    const { left, top } = pxFromVB(pos.x, pos.y);
    const dim = pos.dim ? " dim" : "";
    const cur = pos.current ? " current" : "";
    const vis = visited.has(id) ? " visited" : "";
    const lvl = pos.level === 0 ? "l0" : `l${Math.min(pos.level, 3)}`;
    const entering = newlyEntering.includes(id) ? " entering" : "";
    const cls = `node ${lvl} type-${node.type}${dim}${cur}${vis}${entering}`;
    const tagText = { origin:"起点 · 100% 已发生", main:"主流", contra:"反共识", swan:"⚡ 黑天鹅", shrink:"收缩" }[node.type];
    const impactSign = node.impact > 0 ? "+" : "";
    const impactColor = node.impact > 0 ? "#3F6B3F" : "#8E4A3F";

    nodes.insertAdjacentHTML("beforeend", `
      <div class="${cls}" data-id="${id}" style="left:${left}px;top:${top}px">
        <div class="bubble">
          <div class="bubble-tag">${tagText}</div>
          <div class="bubble-title">${node.title}</div>
          <div class="bubble-meta">
            <span>${(node.prob*100).toFixed(0)}%</span>
            <span class="meter-bar"><span class="meter-fill" style="width:${node.prob*100}%"></span></span>
            <span class="bubble-impact" style="color:${impactColor}">${impactSign}${node.impact}</span>
          </div>
        </div>
      </div>
    `);
  });

  // === Stagger animation: remove .entering with delay ===
  if (newlyEntering.length){
    newlyEntering.forEach((id, i) => {
      setTimeout(() => {
        const el = document.querySelector(`.node[data-id="${id}"]`);
        if (el) el.classList.remove("entering");
      }, 200 + i * 90);  // stagger 90ms each
    });
  }

  prevChildrenIds = currentChildrenIds;

  document.querySelectorAll(".node").forEach(g => {
    g.addEventListener("click", (e) => {
      e.stopPropagation();
      onNodeClick(g.dataset.id);
    });
  });

  updateBreadcrumbs();
  updateDepth();
}

function updateBreadcrumbs(){
  const el = document.getElementById("crumbs");
  const chain = [getOriginId(), ...pathStack];
  el.innerHTML = chain.map((id, i) => {
    const isLast = i === chain.length - 1;
    return `${i > 0 ? '<span class="arr">▸</span>' : ''}<span class="crumb ${isLast ? "now" : ""}" data-jump="${i}">${NODES[id].title}</span>`;
  }).join("");
  document.querySelectorAll(".breadcrumb .crumb").forEach(c => {
    c.addEventListener("click", () => {
      const idx = parseInt(c.dataset.jump, 10);
      pathStack = pathStack.slice(0, idx);
      render(true);
    });
  });
  document.getElementById("backBtn").classList.toggle("show", pathStack.length > 0);
  document.getElementById("hint").classList.toggle("hidden", pathStack.length > 0);
}

function updateDepth(){
  document.getElementById("depth").innerHTML = `深度 <strong>${pathStack.length}</strong> / 3`;
}

function onNodeClick(id){
  const node = NODES[id];
  if (!node) return;
  visited.add(id);
  openPanel(id);

  if (id === getOriginId()){
    pathStack = [];
    render(true);
    return;
  }
  const idxInChain = pathStack.indexOf(id);
  if (idxInChain !== -1){
    pathStack = pathStack.slice(0, idxInChain + 1);
    render(true);
    return;
  }
  pathStack.push(id);
  render(true);
}

function goBack(){
  if (pathStack.length === 0) return;
  pathStack.pop();
  closePanel();
  render(true);
}

// 展开下一层: 进入该节点 (推入 pathStack) + 打开第一个子节点 panel
function expandToChild(id){
  const node = NODES[id];
  if (!node || !node.children || !node.children.length) return;

  // 确保当前节点在 pathStack 末尾
  if (id !== getOriginId()){
    const idx = pathStack.indexOf(id);
    if (idx === -1) pathStack.push(id);
    else pathStack = pathStack.slice(0, idx + 1);
  } else {
    pathStack = [];
  }
  visited.add(id);
  render(true);
  // 滚到第一个 child 的 panel
  setTimeout(() => {
    openPanel(node.children[0]);
    visited.add(node.children[0]);
  }, 350);
}

function getNode(id){
  const base = NODES[id];
  if (!base) return null;
  return { ...base, ...(EXTRAS[id] || {}) };
}

// 兄弟节点导航
function getSiblings(id){
  // 找到 id 所在的同级节点列表
  for (const [pid, pnode] of Object.entries(NODES)){
    if (pnode.children.includes(id)) return { siblings: pnode.children, parent: pid };
  }
  return { siblings: [id], parent: null };
}
let currentPanelId = null;
function updatePager(id){
  currentPanelId = id;
  const { siblings } = getSiblings(id);
  const idx = siblings.indexOf(id);
  const total = siblings.length;
  const info = total > 1 ? `<strong>${idx+1}</strong> / ${total} · 同级` : `单节点`;
  ["prevBtnTop","prevBtnBot"].forEach(bid => {
    const el = document.getElementById(bid);
    if (el) el.disabled = idx <= 0;
  });
  ["nextBtnTop","nextBtnBot"].forEach(bid => {
    const el = document.getElementById(bid);
    if (el) el.disabled = idx >= total - 1;
  });
  const infoEl = document.getElementById("pagerInfoTop");
  if (infoEl) infoEl.innerHTML = info;
}
function navSibling(dir){
  if (!currentPanelId) return;
  const { siblings } = getSiblings(currentPanelId);
  const idx = siblings.indexOf(currentPanelId);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= siblings.length) return;
  openPanel(siblings[newIdx]);
}

function closePanel(){
  document.getElementById("panel").classList.remove("open");
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape"){
    if (document.getElementById("panel").classList.contains("open")){
      closePanel();
    } else {
      goBack();
    }
  }
  // 上下方向键 = 同级翻页
  if (document.getElementById("panel").classList.contains("open")){
    if (e.key === "ArrowDown" || e.key === "ArrowRight"){
      e.preventDefault();
      navSibling(1);
    } else if (e.key === "ArrowUp" || e.key === "ArrowLeft"){
      e.preventDefault();
      navSibling(-1);
    }
  }
});

document.querySelector("main").addEventListener("click", () => {
  closePanel();
});

// 主题切换
function renderThemeBar(){
  const bar = document.getElementById("themeBar");
  bar.innerHTML = THEMES.map(t => `
    <button class="theme-btn ${currentTheme === t.id ? "active" : ""}" data-theme="${t.id}">
      <span class="emoji">${t.emoji}</span>${t.label}
    </button>
  `).join("");
  bar.querySelectorAll(".theme-btn").forEach(b => {
    b.addEventListener("click", () => {
      const tid = b.dataset.theme;
      if (tid === currentTheme) return;
      currentTheme = tid;
      pathStack = [];
      visited.clear();
      visited.add(tid);
      closePanel();
      renderThemeBar();
      render(true);
    });
  });
}

window.addEventListener("resize", () => render(false));
renderThemeBar();
render(false);
</script>
